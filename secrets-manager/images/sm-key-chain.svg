 sans-serif" font-size="15" font-weight="600" fill="#0B1F44" text-anchor="middle">A pod restart wipes the in-memory zone, and the node comes back sealed.</text><text x="640" y="508" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5B82" text-anchor="middle">Three key holders unseal it again, or auto-unseal does it through your KMS or HSM.</text></svg>