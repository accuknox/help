<!doctype html>
<!-- CSPM cover art. Render to cover-art.pdf with build/_kit/cover.py --art cspm.
     A settings panel with posture checks, one misconfigured row flagged red. -->
<html><head><meta charset="utf-8"><style>
@page{size:157.34mm 152.4mm;margin:0}
html,body{margin:0;background:#000025;-webkit-print-color-adjust:exact;print-color-adjust:exact}
svg{display:block;width:157.34mm;height:152.4mm}
</style></head><body>
<svg viewBox="0 0 446 432" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF4646"/><stop offset="1" stop-color="#1040C5"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1040C5"/><stop offset="1" stop-color="#FF4646"/></linearGradient>
  </defs>
  <!-- outer dashed frame -->
  <rect x="96" y="40" width="330" height="330" rx="22" fill="none" stroke="url(#g)" stroke-width=".8" stroke-dasharray="2 4" opacity=".55"/>
  <!-- panel -->
  <rect x="126" y="70" width="270" height="270" rx="14" fill="none" stroke="url(#gv)" stroke-width="1"/>
  <line x1="126" y1="104" x2="396" y2="104" stroke="url(#g)" stroke-width=".6" opacity=".7"/>
  <circle cx="146" cy="87" r="3.2" fill="#FF4646"/><circle cx="160" cy="87" r="3.2" fill="#4F9CF9"/><circle cx="174" cy="87" r="3.2" fill="#1040C5"/>
  <!-- rows: label bar + toggle -->
  <g stroke="#4F9CF9" stroke-width=".8" fill="none" opacity=".75">
    <line x1="150" y1="136" x2="270" y2="136"/><line x1="150" y1="180" x2="250" y2="180"/>
    <line x1="150" y1="268" x2="262" y2="268"/><line x1="150" y1="312" x2="236" y2="312"/>
  </g>
  <g fill="none" stroke="#4F9CF9" stroke-width="1">
    <rect x="320" y="126" width="40" height="20" rx="10"/><rect x="320" y="170" width="40" height="20" rx="10"/>
    <rect x="320" y="258" width="40" height="20" rx="10"/><rect x="320" y="302" width="40" height="20" rx="10"/>
  </g>
  <g fill="#1040C5"><circle cx="350" cy="136" r="7"/><circle cx="350" cy="180" r="7"/><circle cx="350" cy="268" r="7"/><circle cx="350" cy="312" r="7"/></g>
  <!-- flagged row -->
  <line x1="150" y1="224" x2="282" y2="224" stroke="#FF4646" stroke-width="1"/>
  <rect x="320" y="214" width="40" height="20" rx="10" fill="none" stroke="#FF4646" stroke-width="1"/>
  <circle cx="330" cy="224" r="7" fill="#FF4646"/>
  <circle cx="330" cy="224" r="16" fill="none" stroke="#FF4646" stroke-width=".8"/>
  <circle cx="330" cy="224" r="26" fill="none" stroke="#FF4646" stroke-width=".6" stroke-dasharray="2 3" opacity=".8"/>
  <!-- scan link out to a fix node -->
  <path d="M330 250 C 330 300, 250 380, 160 392" fill="none" stroke="url(#g)" stroke-width=".8" stroke-dasharray="2 3"/>
  <circle cx="156" cy="392" r="5" fill="#4F9CF9"/>
  <!-- loose dots -->
  <circle cx="60" cy="150" r="2.6" fill="#1040C5"/><circle cx="430" cy="24" r="2.6" fill="#4F9CF9"/><circle cx="420" cy="398" r="2.4" fill="#4F9CF9"/>
</svg>
</body></html>
