<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url('fonts/Inter-Regular.ttf');font-weight:400}
@font-face{font-family:Inter;src:url('fonts/Inter-SemiBold.ttf');font-weight:600}
@font-face{font-family:Inter;src:url('fonts/Inter-ExtraLight.ttf');font-weight:200}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1200px;background:#000025;font-family:Inter;color:#fff;position:relative;overflow:hidden}
.rings{position:absolute;right:-260px;top:-260px;width:900px;height:900px}
.logo{position:absolute;left:80px;top:80px;height:46px;filter:brightness(0) invert(1)}
.eyebrow{position:absolute;left:80px;top:300px;font-size:22px;font-weight:600;letter-spacing:.14em;color:#4F9CF9}
h1{position:absolute;left:80px;top:350px;width:560px;font-size:76px;line-height:1.02;font-weight:600;letter-spacing:-.035em}
h1 span{background:linear-gradient(90deg,#FF4646,#1040C5) left bottom/100% 7px no-repeat;padding-bottom:4px}
.deck{position:absolute;left:80px;top:690px;width:520px;font-size:30px;line-height:1.3;color:rgba(255,255,255,.72)}
.cover{position:absolute;right:80px;top:250px;width:440px;border-radius:10px;box-shadow:0 0 0 3px rgba(79,156,249,.6),0 30px 80px rgba(16,64,197,.45);transform:rotate(3deg)}
.foot{position:absolute;left:80px;bottom:70px;font-size:22px;color:rgba(255,255,255,.55)}
</style></head><body>
<svg class="rings" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF4646"/><stop offset="1" stop-color="#1040C5"/></linearGradient></defs><g fill="none" stroke="url(#g)" stroke-width=".4" opacity=".55"><circle cx="100" cy="100" r="40"/><circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="80" stroke-dasharray="2 3"/></g></svg>
<img class="logo" src="logo.png">
<div class="eyebrow">CHEAT SHEET</div>
<h1>Kubernetes security best practices <span>guide</span></h1>
<p class="deck">Do's and don'ts for KSPM and admission control, plus a gap check.</p>
<img class="cover" src="cover.png">
<div class="foot">Free download · accuknox.com</div>
</body></html>
