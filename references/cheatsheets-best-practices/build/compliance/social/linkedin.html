<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url('../fonts/Inter-ExtraLight.ttf');font-weight:200}
@font-face{font-family:Inter;src:url('../fonts/Inter-Regular.ttf');font-weight:400}
@font-face{font-family:Inter;src:url('../fonts/Inter-SemiBold.ttf');font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1200px;background:#000025;font-family:Inter;color:#fff;position:relative;overflow:hidden}
.ring{position:absolute;right:-260px;top:-240px;width:900px;height:900px}
.l{position:absolute;left:80px;top:80px;height:46px;filter:brightness(0) invert(1)}
.copy{position:absolute;left:80px;top:300px;width:560px}
.eb{font-size:22px;font-weight:600;letter-spacing:.14em;color:#4F9CF9;margin-bottom:30px}
h1{font-size:76px;line-height:1.04;font-weight:600;letter-spacing:-.035em}
.ul{background:linear-gradient(90deg,#FF4646,#1040C5) left bottom/100% 7px no-repeat;padding-bottom:4px}
.d{font-size:28px;line-height:1.35;color:rgba(255,255,255,.72);margin-top:34px}
.thumb{position:absolute;right:80px;top:250px;width:420px;border-radius:10px;border:3px solid #4F9CF9;transform:rotate(3deg)}
.foot{position:absolute;left:80px;bottom:72px;font-size:24px;color:rgba(255,255,255,.6)}
.bar{position:absolute;left:80px;bottom:130px;width:120px;height:6px;background:linear-gradient(90deg,#FF4646,#1040C5)}
</style></head><body>
<svg class="ring" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF4646"/><stop offset="1" stop-color="#1040C5"/></linearGradient></defs><g fill="none" stroke="url(#g)" stroke-width=".4" opacity=".7"><circle cx="100" cy="100" r="40"/><circle cx="100" cy="100" r="62"/><circle cx="100" cy="100" r="84" stroke-dasharray="2 3"/></g></svg>
<img class="l" src="logo.png">
<div class="copy"><div class="eb">CHEAT SHEET</div><h1>Cloud Compliance Best Practices <span class="ul">Do's and Don'ts</span></h1><p class="d">Six practices that keep you audit ready, from control mapping to drift.</p></div>
<img class="thumb" src="cover.png">
<div class="bar"></div><div class="foot">accuknox.com</div>
</body></html>
