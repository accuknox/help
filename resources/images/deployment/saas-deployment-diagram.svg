<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">AccuKnox SaaS deployment model</title>
  <desc id="d">Cloud accounts, Kubernetes, VMs and bare metal, and AI models feed an agentless scan, which connects over read-only cloud APIs to the AccuKnox Control Plane hosted by AccuKnox.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .tab{font:500 15px Inter,sans-serif;fill:#0E1526}
      .ct{font:600 15px 'Inter Tight',Inter,sans-serif;letter-spacing:-.15px;fill:#0E1526}
      .cs{font:500 11.5px 'JetBrains Mono',monospace;fill:#5A6072}
      .lbl{font:600 13px 'Inter Tight',Inter,sans-serif;fill:#0E1526}
      .sm{font:500 11px 'JetBrains Mono',monospace;fill:#5A6072}
      .chip{font:500 10.5px 'JetBrains Mono',monospace;fill:#23409A}
      .badge{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.66px;fill:#15803D}
      .ic{fill:none;stroke:#1D5BF0;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .flow{stroke-dasharray:5 5;animation:flow 1.1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-20}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1B2233"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1D5BF0"/></marker>
    <linearGradient id="cpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6FD"/><stop offset="1" stop-color="#CBDAFC"/></linearGradient>
    <filter id="cpShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1D5BF0" flood-opacity=".3"/></filter>
    <filter id="lockShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".12"/></filter>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path class="ic" d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><g class="ic"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5Z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></g></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><g class="ic"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><g class="ic"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><g class="ic"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="#1D5BF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></g></symbol>
    <symbol id="i-cloudtab" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z" fill="none" stroke="#1D5BF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="#0E1526" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g></symbol>
  </defs>

  <!-- Left folder: Your cloud accounts -->
  <path d="M0 14Q0 0 14 0H201Q215 0 215 14V45H622Q640 45 640 63V430Q640 448 622 448H18Q0 448 0 430Z" fill="#FBFAF7" stroke="#D8D4CA"/>
  <use href="#i-cloudtab" x="20" y="14.5" width="17" height="17"/>
  <text class="tab" x="47" y="28.5">Your cloud accounts</text>
  <rect x="24.5" y="72.5" width="591" height="349" rx="14" fill="#ECEAE4" stroke="#DDD9D0"/>

  <!-- Right folder: AccuKnox cloud -->
  <path d="M760 14Q760 0 774 0H930Q944 0 944 14V45H1262Q1280 45 1280 63V430Q1280 448 1262 448H778Q760 448 760 430Z" fill="#FBFAF7" stroke="#D8D4CA"/>
  <use href="#i-shield" x="780" y="14.5" width="17" height="17"/>
  <text class="tab" x="807" y="28.5">AccuKnox cloud</text>
  <rect x="784.5" y="72.5" width="471" height="349" rx="14" fill="#ECEAE4" stroke="#DDD9D0"/>

  <!-- Wires -->
  <g stroke="#1B2233" stroke-width="1.4" fill="none">
    <path class="flow" d="M300 136H330Q342 136 342 148V252"/>
    <path class="flow" d="M300 212H330Q342 212 342 224V252"/>
    <path class="flow" d="M300 288H330Q342 288 342 276V252"/>
    <path class="flow" d="M300 364H330Q342 364 342 352V252"/>
    <path class="flow" d="M342 252H392" marker-end="url(#a)"/>
  </g>
  <g stroke="#1D5BF0" stroke-width="1.4" fill="none">
    <path class="flow" d="M562 252H666"/>
    <path class="flow" d="M724 252H858" marker-end="url(#ab)"/>
  </g>

  <!-- Source cards -->
  <g>
    <rect x="48.5" y="104.5" width="251" height="63" rx="12" fill="#fff" stroke="#A8BFF3"/>
    <rect x="64" y="119" width="34" height="34" rx="8" fill="#E3EBFD"/><use href="#i-cloud" x="72" y="127" width="18" height="18"/>
    <text class="ct" x="111" y="133">Cloud accounts</text><text class="cs" x="111" y="151">AWS · Azure · GCP · OCI</text>

    <rect x="48.5" y="180.5" width="251" height="63" rx="12" fill="#fff" stroke="#A8BFF3"/>
    <rect x="64" y="195" width="34" height="34" rx="8" fill="#E3EBFD"/><use href="#i-box" x="72" y="203" width="18" height="18"/>
    <text class="ct" x="111" y="209">Kubernetes</text><text class="cs" x="111" y="227">OpenShift · EKS · AKS</text>

    <rect x="48.5" y="256.5" width="251" height="63" rx="12" fill="#fff" stroke="#A8BFF3"/>
    <rect x="64" y="271" width="34" height="34" rx="8" fill="#E3EBFD"/><use href="#i-server" x="72" y="279" width="18" height="18"/>
    <text class="ct" x="111" y="285">VMs &amp; bare metal</text><text class="cs" x="111" y="303">VMware · Nutanix</text>

    <rect x="48.5" y="332.5" width="251" height="63" rx="12" fill="#fff" stroke="#A8BFF3"/>
    <rect x="64" y="347" width="34" height="34" rx="8" fill="#E3EBFD"/><use href="#i-chip" x="72" y="355" width="18" height="18"/>
    <text class="ct" x="111" y="361">AI models &amp; agents</text><text class="cs" x="111" y="379">vLLM · Hugging Face</text>
  </g>

  <!-- Agentless scan -->
  <rect x="394.5" y="204.5" width="167" height="95" rx="12" fill="#fff" stroke="#A8BFF3"/>
  <rect x="461" y="213" width="34" height="34" rx="8" fill="#E3EBFD"/><use href="#i-eye" x="469" y="221" width="18" height="18"/>
  <text class="ct" x="478" y="267" text-anchor="middle">Agentless scan</text>
  <text class="cs" x="478" y="286" text-anchor="middle">no install</text>

  <!-- Read-only boundary -->
  <text class="lbl" x="700" y="163" text-anchor="middle">Read-only</text>
  <text class="sm" x="700" y="181" text-anchor="middle">cloud APIs</text>
  <rect x="668.5" y="225.5" width="53" height="53" rx="14" fill="#fff" stroke="#BDB8AD" filter="url(#lockShadow)"/>
  <use href="#i-lock" x="684" y="241" width="22" height="22"/>

  <!-- Control plane -->
  <rect x="860.5" y="180.5" width="299" height="143" rx="14" fill="url(#cpg)" stroke="#7FA2EE" filter="url(#cpShadow)"/>
  <text class="ct" x="1010" y="215" text-anchor="middle" style="font-size:17px">AccuKnox</text>
  <text class="ct" x="1010" y="236" text-anchor="middle" style="font-size:17px">Control Plane</text>
  <text class="cs" x="1010" y="256" text-anchor="middle" style="fill:#34529A">hosted by AccuKnox</text>
  <g>
    <rect x="916.5" y="271.5" width="63" height="21" rx="6" fill="#fff" stroke="#B9CCF6"/><text class="chip" x="948" y="285.5" text-anchor="middle">Findings</text>
    <rect x="985.5" y="271.5" width="63" height="21" rx="6" fill="#fff" stroke="#B9CCF6"/><text class="chip" x="1017" y="285.5" text-anchor="middle">Policies</text>
    <rect x="1054.5" y="271.5" width="50" height="21" rx="6" fill="#fff" stroke="#B9CCF6"/><text class="chip" x="1079.5" y="285.5" text-anchor="middle">AI-BOM</text>
  </g>

  <!-- Badge -->
  <rect x="860.5" y="352.5" width="188" height="25" rx="12.5" fill="#E6F4EA" stroke="#BFE3CB"/>
  <circle cx="875" cy="365" r="3" fill="#15803D"/>
  <text class="badge" x="885" y="369">FINDINGS THE SAME DAY</text>
</svg>
