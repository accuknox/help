<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AccuKnox Report</title>
<style>
@font-face{font-family:Inter;src:url('fonts/Inter-ExtraLight.ttf') format('truetype');font-weight:200;font-style:normal;font-display:block}
@font-face{font-family:Inter;src:url('fonts/Inter-Light.ttf') format('truetype');font-weight:300;font-style:normal;font-display:block}
@font-face{font-family:Inter;src:url('fonts/Inter-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:Inter;src:url('fonts/Inter-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:Inter;src:url('fonts/Inter-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:Inter;src:url('fonts/Inter-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}
:root{
  --ak-blue:#1040C5;--ak-logo-blue:#0000C8;--ak-bright:#0F7FFF;--ak-sky:#4F9CF9;
  --ak-navy:#000025;--ak-navy2:#080F53;--ak-red:#D63637;--ak-logo-red:#CB0018;
  --ak-coral:#FF4646;--ak-yellow:#FFD900;--ak-green:#04B745;
  --ink:#263238;--ink-2:#37474F;--ink-3:#607D8B;--rule:#CFD8DC;
  --tint-ice:#F8FAFF;--tint-aqua:#E9F8FE;--tint-blue:#E2EEFF;--tint-rose:#FEF7F7;--tint-pink:#FFE3E3;
  --grad:linear-gradient(90deg,#FF4646 0%,#1040C5 100%);
  --hl:rgba(255,217,0,.55);
}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:Inter;color:var(--ink-2);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;padding:24mm 17mm 26mm;break-after:page;background:var(--bg,#fff)}
.page:last-child{break-after:auto}
.bg-white{--bg:#fff}.bg-ice{--bg:var(--tint-ice)}.bg-aqua{--bg:var(--tint-aqua)}.bg-blue{--bg:var(--tint-blue)}
.bg-rose{--bg:var(--tint-rose)}
.bg-navy{--bg:var(--ak-navy);color:#fff}
.bg-navy .h-display,.bg-navy .h1,.bg-navy .h2{color:#fff}
.bg-navy .body,.bg-navy p{color:rgba(255,255,255,.78)}
.foot{position:absolute;left:17mm;right:17mm;bottom:11mm;display:flex;justify-content:space-between;align-items:center}
.foot .logo{height:6.2mm}
.foot .folio{font-size:8.5pt;font-weight:600;color:var(--ink-2)}
.foot .src{font-size:8pt;color:var(--ink-3)}
.foot .src a{color:var(--ak-blue);text-decoration:none}
.bg-navy .foot .folio{color:#fff}
.logo-white{filter:brightness(0) invert(1)}
.h-display{font-size:64pt;line-height:1.02;font-weight:600;letter-spacing:-.035em;color:var(--ink)}
.h1{font-size:50pt;line-height:1.05;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.h2{font-size:30pt;line-height:1.1;font-weight:600;letter-spacing:-.025em;color:var(--ink)}
.h3{font-size:15pt;line-height:1.25;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.deck{font-size:18pt;line-height:1.3;font-weight:400;color:var(--ink-3);letter-spacing:-.01em;margin-top:4mm}
.lede{font-size:12.5pt;line-height:1.5;color:var(--ink-2);max-width:150mm}
.body{font-size:11.5pt;line-height:1.6;color:var(--ink-2)}
.body p+p{margin-top:3.5mm}
.body b,.lede b{color:var(--ink);font-weight:600}
.meta{font-size:8.5pt;color:var(--ink-3);letter-spacing:.02em}
.caps{font-size:8pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ak-blue)}
.stat{font-size:110pt;line-height:.95;font-weight:200;letter-spacing:-.05em;color:var(--ink)}
.stat-m{font-size:64pt;line-height:1;font-weight:200;letter-spacing:-.045em;color:var(--ink)}
.stat-s{font-size:38pt;line-height:1;font-weight:200;letter-spacing:-.04em;color:var(--ink)}
.num-ghost{font-size:64pt;font-weight:200;letter-spacing:-.04em;color:var(--ak-sky);line-height:1}
.chip{display:inline-block;background:var(--ak-yellow);color:var(--ink);font-size:8.5pt;font-weight:500;padding:1.4mm 2.6mm;border-radius:1mm;margin-bottom:5mm}
.chip.blue{background:var(--tint-blue);color:var(--ak-blue)}
.hl{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
.accent{color:var(--ak-blue)}
.ul{background:var(--grad) left bottom/100% .09em no-repeat;padding-bottom:.04em}
.rule{height:.3mm;background:var(--rule);border:0}
.rule-grad{height:.8mm;background:var(--grad);border:0;width:22mm}
.stack>*+*{margin-top:var(--gap,6mm)}
.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:9mm}
.cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:7mm}
.push-right{margin-left:64mm}
.bottom{position:absolute;left:17mm;right:17mm;bottom:28mm}
.panel{background:#fff;border:.3mm solid var(--rule);border-radius:4mm;padding:9mm 10mm;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:1.4mm;background:var(--grad)}
.panel.navy{background:var(--ak-navy);border-color:var(--ak-navy);color:#fff}
.panel.navy .stat,.panel.navy .stat-m{color:#fff}
.nlist .row{display:grid;grid-template-columns:52mm 1fr;gap:6mm;padding:6mm 0;border-top:.3mm solid var(--rule)}
.nlist .row:first-child{border-top:0}
.nlist .icon{width:13mm;height:13mm;margin-bottom:3mm}
.ntable{width:100%;border-collapse:collapse}
.ntable th{font-size:8.5pt;font-weight:600;color:var(--ak-blue);text-align:left;padding:0 0 3mm}
.ntable td{padding:5mm 0;border-top:.3mm solid var(--rule);vertical-align:middle}
.ntable td.lbl{font-size:11pt;color:var(--ink);width:36%}
.ntable td.v{font-size:38pt;font-weight:200;letter-spacing:-.04em;color:var(--ink)}
.ntable td.v small{font-size:9pt;font-weight:400;letter-spacing:0;color:var(--ink-3);margin-left:1.5mm}
.toc .item{display:grid;grid-template-columns:1fr 18mm;align-items:end;margin-top:9mm}
.toc .t{font-size:21pt;line-height:1.2;font-weight:500;letter-spacing:-.02em;color:var(--ink)}
.toc .p{font-size:21pt;font-weight:300;text-align:right;color:var(--ink)}
.bar{height:5mm;border-radius:1mm;background:var(--ak-blue)}
.bar.alt{background:var(--ak-sky)}.bar.warn{background:var(--ak-red)}
.pill{display:inline-flex;align-items:center;gap:2mm;border:.3mm solid var(--rule);border-radius:10mm;padding:1.5mm 3.5mm;font-size:8.5pt;color:var(--ink-2);background:#fff}
.flow{display:flex;align-items:center;gap:3mm}
.flow .node{flex:1;border:.3mm solid var(--rule);border-radius:3mm;background:#fff;padding:5mm}
.flow .arrow{width:10mm;height:.4mm;background:var(--grad);position:relative}
.flow .arrow::after{content:"";position:absolute;right:-.5mm;top:-1.1mm;border:1.3mm solid transparent;border-left-color:var(--ak-blue)}
.cta{display:inline-block;background:var(--ak-blue);color:#fff;font-weight:600;font-size:11pt;padding:4mm 7mm;border-radius:2mm;text-decoration:none}
.cta.ghost{background:transparent;border:.5mm solid #fff}
.link{color:var(--ak-blue);text-decoration:none;font-weight:500}
.art{position:absolute;pointer-events:none}
.shot{background:#fff;border:.3mm solid var(--rule);border-radius:3mm;padding:2.5mm;position:relative;overflow:hidden}
.shot::before{content:"";position:absolute;left:0;right:0;top:0;height:1mm;background:var(--grad)}
.shot img{display:block;width:100%;height:auto;border-radius:1.5mm;margin-top:1mm}
.shot-cap{font-size:8.5pt;color:var(--ink-3);margin-top:2.5mm}
.shot-cap a{color:var(--ak-blue);text-decoration:none}
</style>
</head>
<body>
<!-- PAGES -->
</body>
</html>
