<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">AccuKnox air-gapped deployment</title>
  <desc id="d">Private cloud, Kubernetes, VMs and AI models feed KubeArmor runtime sensors, which report to an AccuKnox Control Plane inside your isolated network. There is no connection to AccuKnox and no call-home.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .tab{font:500 15px Inter,sans-serif;fill:#0E1526}
      .ct{font:600 15px 'Inter Tight',Inter,sans-serif;letter-spacing:-.15px;fill:#0E1526}
      .cs{font:500 11.5px 'JetBrains Mono',monospace;fill:#5A6072}
      .lbl{font:600 13px 'Inter Tight',Inter,sans-serif;fill:#0E1526}
      .lbl.r{fill:#C2362B}
      .sm{font:500 11px 'JetBrains Mono',monospace;fill:#5A6072}
      .chip{font:500 10.5px 'JetBrains Mono',monospace;fill:#23409A}
      .badge{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.66px;fill:#15803D}
      .ic{fill:none;stroke:#1D5BF0;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .ic.g{stroke:#3B4256}
      .flow{stroke-dasharray:5 5;animation:flow 1.1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-20}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1B2233"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1D5BF0"/></marker>
    <linearGradient id="cpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6FD"/><stop offset="1" stop-color="#CBDAFC"/></linearGradient>
    <filter id="cpShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1D5BF0" flood-opacity=".3"/></filter>
    <filter id="lockShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".12"/></filter>
  </defs>

